<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Context & TPS Monitor</title>
  <script src="/preload.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: var(--background, #0f172a);
      color: var(--foreground, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      -webkit-font-smoothing: antialiased;
      font-size: 12px;
      line-height: 1.45;
    }
    .card {
      background: var(--card, rgba(30, 41, 59, 0.75));
      border: 1px solid var(--border, rgba(148, 163, 184, 0.18));
      border-radius: 10px;
      padding: 12px;
    }
    .subcard {
      background: rgba(148, 163, 184, 0.06);
      border: 1px solid var(--border, rgba(148, 163, 184, 0.14));
      border-radius: 8px;
      padding: 8px 10px;
    }
    .muted { color: var(--muted-foreground, #94a3b8); }
    select, button {
      background: var(--card, #1e293b);
      color: var(--foreground, #f8fafc);
      border: 1px solid var(--border, rgba(148, 163, 184, 0.3));
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 11px;
      cursor: pointer;
    }
    button:hover { border-color: rgba(56, 189, 248, 0.5); }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    th, td {
      padding: 5px 6px;
      text-align: right;
      border-bottom: 1px solid var(--border, rgba(148, 163, 184, 0.14));
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
    /* Self-contained utility classes (zero external CDN dependency) */
    .max-w-5xl { max-width: 64rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .space-y-0\.5 > * + * { margin-top: 2px; }
    .space-y-1 > * + * { margin-top: 4px; }
    .space-y-1\.5 > * + * { margin-top: 6px; }
    .space-y-2 > * + * { margin-top: 8px; }
    .space-y-2\.5 > * + * { margin-top: 10px; }
    .space-y-3 > * + * { margin-top: 12px; }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .flex-auto { flex: 1 1 auto; }
    .inline-block { display: inline-block; }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 520px) {
      .sm\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .sm\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    /* Narrow panes keep only #, Context, tok/s and Cost in the turns table. */
    @media (max-width: 519px) {
      .wide-only { display: none; }
    }
    table.no-ttft .col-ttft { display: none; }
    /* Badges filled by renderData stay hidden until they have text. */
    #ctxStatusBadge:empty, #turnCountBadge:empty, #pricingModelTag:empty { display: none; }
    .items-center { align-items: center; }
    .items-baseline { align-items: baseline; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 4px; }
    .gap-1\.5 { gap: 6px; }
    .gap-2 { gap: 8px; }
    .gap-2\.5 { gap: 10px; }
    .gap-3 { gap: 12px; }
    .min-w-0 { min-width: 0; }
    .shrink-0 { flex-shrink: 0; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .w-2 { width: 8px; }
    .h-2 { height: 8px; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .h-1\.5 { height: 6px; }
    .h-3 { height: 12px; }
    .h-24 { height: 96px; }
    .w-\[2px\] { width: 2px; }
    .max-w-\[145px\] { max-width: 145px; }
    .max-w-\[175px\] { max-width: 175px; }
    .max-w-\[60\%\] { max-width: 60%; }
    .max-h-64 { max-height: 256px; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .top-0 { top: 0; }
    .bottom-0 { bottom: 0; }
    .z-10 { z-index: 10; }
    .overflow-hidden { overflow: hidden; }
    .overflow-visible { overflow: visible; }
    .overflow-x-auto { overflow-x: auto; }
    .overflow-y-auto { overflow-y: auto; }
    .rounded { border-radius: 4px; }
    .rounded-full { border-radius: 9999px; }
    .border { border: 1px solid currentColor; }
    .border-t { border-top: 1px solid rgba(100, 116, 139, 0.15); }
    .border-slate-500\/10 { border-color: rgba(100, 116, 139, 0.1); }
    .border-slate-500\/15 { border-color: rgba(100, 116, 139, 0.15); }
    .border-emerald-500\/25 { border-color: rgba(16, 185, 129, 0.25); }
    .border-emerald-500\/30 { border-color: rgba(16, 185, 129, 0.3); }
    .border-emerald-500\/40 { border-color: rgba(16, 185, 129, 0.4); }
    .border-amber-500\/30 { border-color: rgba(245, 158, 11, 0.3); }
    .border-amber-500\/40 { border-color: rgba(245, 158, 11, 0.4); }
    .border-rose-500\/30 { border-color: rgba(244, 63, 94, 0.3); }
    .border-sky-500\/25 { border-color: rgba(14, 165, 233, 0.25); }
    .px-1 { padding-left: 4px; padding-right: 4px; }
    .px-1\.5 { padding-left: 6px; padding-right: 6px; }
    .px-2 { padding-left: 8px; padding-right: 8px; }
    .py-0\.5 { padding-top: 2px; padding-bottom: 2px; }
    .py-2\.5 { padding-top: 10px; padding-bottom: 10px; }
    .pt-0\.5 { padding-top: 2px; }
    .pt-1 { padding-top: 4px; }
    .pt-2 { padding-top: 8px; }
    .mr-1 { margin-right: 4px; }
    .ml-auto { margin-left: auto; }
    .text-\[10px\] { font-size: 10px; }
    .text-\[11px\] { font-size: 11px; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13.5px; }
    .text-base { font-size: 15px; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .select-none { user-select: none; }
    .cursor-pointer { cursor: pointer; }
    .opacity-80 { opacity: 0.8; }
    .transition-all { transition: all 0.3s ease; }
    .duration-300 { transition-duration: 300ms; }
    .text-emerald-400 { color: #34d399; }
    .text-sky-400 { color: #38bdf8; }
    .text-amber-400 { color: #fbbf24; }
    .text-amber-400\/90 { color: rgba(251, 191, 36, 0.9); }
    .text-rose-400 { color: #fb7185; }
    .text-violet-400 { color: #a78bfa; }
    .text-violet-300 { color: #c4b5fd; }
    .bg-emerald-400 { background-color: #34d399; }
    .bg-emerald-500 { background-color: #10b981; }
    .bg-emerald-500\/10 { background-color: rgba(16, 185, 129, 0.1); }
    .bg-emerald-500\/15 { background-color: rgba(16, 185, 129, 0.15); }
    .bg-sky-400 { background-color: #38bdf8; }
    .bg-sky-500\/10 { background-color: rgba(14, 165, 233, 0.1); }
    .bg-amber-500 { background-color: #f59e0b; }
    .bg-amber-500\/15 { background-color: rgba(245, 158, 11, 0.15); }
    .bg-amber-500\/30 { background-color: rgba(245, 158, 11, 0.3); }
    .bg-amber-400\/90 { background-color: rgba(251, 191, 36, 0.9); }
    .bg-rose-500 { background-color: #f43f5e; }
    .bg-rose-500\/15 { background-color: rgba(244, 63, 94, 0.15); }
    .bg-rose-400\/90 { background-color: rgba(251, 113, 133, 0.9); }
    .bg-violet-400 { background-color: #a78bfa; }
    .bg-violet-500\/15 { background-color: rgba(139, 92, 246, 0.15); }
    .bg-slate-500\/15 { background-color: rgba(100, 116, 139, 0.15); }
    .bg-slate-500\/20 { background-color: rgba(100, 116, 139, 0.2); }
  </style>
</head>
<body class="antialiased space-y-2.5 text-xs max-w-5xl mx-auto">

  <!-- Header: model, data source, conversation, controls -->
  <div class="card flex flex-wrap items-center justify-between gap-2 py-2.5">
    <div class="flex flex-auto items-center gap-2 min-w-0">
      <span id="liveDot" class="inline-block w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
      <span class="font-semibold text-sm truncate shrink-0 max-w-[60%]" id="modelBadge">Context & TPS</span>
      <span id="sourceBadge" class="px-1.5 py-0.5 rounded text-[11px] border border-current opacity-80 shrink-0">RPC</span>
      <span id="convTitle" class="muted truncate min-w-0"></span>
    </div>
    <div class="flex flex-wrap items-center gap-1.5">
      <label class="flex items-center gap-1 cursor-pointer muted select-none text-[11px]">
        <input type="checkbox" id="autoFollow" checked />
        <span data-i18n="autoFollow">跟随最新</span>
      </label>
      <select id="convSelect" data-i18n-title="convSelectTitle" class="max-w-[145px] truncate"></select>
      <select id="pricingSelect" data-i18n-title="pricingSelectTitle" class="max-w-[175px] truncate">
        <option value="auto" data-i18n="priceAuto">计价：按模型自动</option>
        <option value="gemini_4_argon">Gemini 4 Argon ($2/$10 → $4/$20)</option>
        <option value="gemini_3_1_pro">Gemini 3.1 Pro ($2/$12)</option>
        <option value="gemini_pro">Gemini 2.5 Pro ($1.25/$10)</option>
        <option value="gemini_flash">Gemini Flash ($0.30/$2.5)</option>
        <option value="claude_sonnet">Claude Sonnet 4.6+ ($3/$15)</option>
        <option value="claude_opus">Claude Opus 4.6+ ($5/$25)</option>
      </select>
      <button id="langToggle" type="button" data-i18n-title="langToggleTitle" class="font-medium">EN</button>
    </div>
  </div>

  <!-- Context: distance to auto-compaction first, then the model window -->
  <div class="card space-y-2.5">
    <div class="flex flex-wrap items-center justify-between gap-1.5">
      <div class="flex items-center gap-2">
        <span class="font-semibold text-sm" data-i18n="ctxHeroTitle">Context 用量</span>
        <span id="turnCountBadge" class="px-1.5 py-0.5 rounded bg-slate-500/15 muted text-[11px] tabular-nums"></span>
      </div>
      <span id="ctxStatusBadge" class="px-2 py-0.5 rounded text-[11px] font-medium bg-emerald-500/15 text-emerald-400 border border-emerald-500/30"></span>
    </div>

    <div class="space-y-1">
      <div class="flex flex-wrap items-baseline justify-between gap-1">
        <span class="muted" data-i18n="compBarTitle">自动压缩阈值</span>
        <span id="ctxRemain" class="text-sm font-bold tabular-nums text-emerald-400"></span>
      </div>
      <div class="relative w-full h-3 rounded-full bg-slate-500/20 overflow-hidden">
        <div id="ctxBar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
        <div id="tick200kComp" class="absolute top-0 bottom-0 w-[2px] bg-amber-400/90 z-10" style="left: 78.13%" data-i18n-title="tick200kTitle"></div>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-1 text-[11px] muted">
        <span id="tick200kLegend" class="text-amber-400/90" data-i18n="tick200k">▲ 200k 长上下文计价线</span>
        <span id="ctxCompRemain" class="tabular-nums ml-auto"></span>
      </div>
    </div>

    <div class="pt-1 border-t border-slate-500/15 space-y-1">
      <div class="flex flex-wrap items-baseline justify-between gap-1 text-[11px]">
        <span class="muted" data-i18n="physBarTitle">模型窗口</span>
        <span id="ctxTokens" class="muted tabular-nums"></span>
      </div>
      <div class="relative w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden">
        <div id="ctxPhysBar" class="h-full bg-sky-400 transition-all duration-300" style="width: 0%"></div>
        <div id="tick200kPhys" class="absolute top-0 bottom-0 w-[2px] bg-amber-400/90 z-10" style="left: 19.07%" data-i18n-title="tick200kTitle"></div>
        <div id="tick256kPhys" class="absolute top-0 bottom-0 w-[2px] bg-rose-400/90 z-10" style="left: 24.41%" data-i18n-title="tickCompTitle"></div>
      </div>
    </div>
  </div>

  <!-- Speed, last turn, cache -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
    <div class="card space-y-1.5">
      <div class="flex items-center justify-between gap-1">
        <span class="muted font-medium" data-i18n="speedTitle">速度</span>
        <span id="tpsModeLabel" class="muted text-[11px]"></span>
      </div>
      <div class="flex items-baseline justify-between gap-1">
        <span class="text-base font-bold tabular-nums text-violet-400" id="mainTps">-- tok/s</span>
        <span class="muted tabular-nums text-[11px]" id="subTps"></span>
      </div>
      <div class="flex justify-between gap-1 muted text-[11px] pt-0.5 border-t border-slate-500/10">
        <span id="avgTps"></span>
        <span id="peakTps"></span>
      </div>
    </div>

    <div class="card space-y-1.5">
      <div class="flex items-center justify-between gap-1">
        <span class="muted font-medium" data-i18n="lastTurnTitle">本轮</span>
        <span id="ttftVal" class="font-bold text-amber-400 tabular-nums"></span>
      </div>
      <div class="text-base font-bold tabular-nums" id="outTokens"></div>
      <div id="lastTurnFooter" class="flex justify-between gap-1 muted text-[11px] pt-0.5 border-t border-slate-500/10">
        <span id="thinkRespSplit"></span>
        <span id="avgTtft"></span>
      </div>
    </div>

    <div class="card space-y-1.5">
      <div class="flex items-center justify-between gap-1">
        <span class="muted font-medium" data-i18n="cacheTitle">缓存命中率</span>
        <span id="cacheRate" class="font-bold text-sky-400 tabular-nums">0.0%</span>
      </div>
      <div class="flex items-baseline justify-between gap-1">
        <span class="text-base font-bold tabular-nums text-sky-400" id="cacheTokens"></span>
        <span id="uncachedTokens" class="text-amber-400 text-[11px] tabular-nums"></span>
      </div>
      <div class="w-full h-1.5 rounded-full overflow-hidden bg-amber-500/30 flex">
        <div id="cacheBar" class="h-full bg-sky-400 transition-all duration-300" style="width: 0%"></div>
      </div>
      <div class="muted text-[11px]" id="sessionCacheRate"></div>
    </div>
  </div>

  <!-- Session cost and per-model breakdown -->
  <div class="card space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-1.5">
      <div class="flex flex-wrap items-center gap-2">
        <span class="font-semibold text-sm" data-i18n="billingTitle">会话费用</span>
        <span id="pricingModelTag" class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 text-[11px]"></span>
      </div>
      <span id="sessionTotalBadge" class="muted text-[11px] tabular-nums"></span>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      <div class="subcard border-emerald-500/25 bg-emerald-500/10 space-y-0.5">
        <div class="muted text-[11px]" data-i18n="estTotalCost">按 API 标价</div>
        <div class="text-base font-bold tabular-nums text-emerald-400" id="costTotalUsd">$0.000</div>
        <div class="muted text-[11px] tabular-nums" id="costLastTurn"></div>
      </div>
      <div class="subcard border-sky-500/25 bg-sky-500/10 space-y-0.5">
        <div class="muted text-[11px]" data-i18n="cacheSaved">缓存节省</div>
        <div class="text-base font-bold tabular-nums text-sky-400" id="costSavedUsd">$0.000</div>
        <div class="muted text-[11px] tabular-nums" id="costNoCacheUsd"></div>
      </div>
      <div class="subcard space-y-0.5">
        <div class="flex justify-between muted text-[11px]"><span data-i18n="cumInput">输入 Token</span><span id="costSplitUsd" class="text-sky-400 tabular-nums"></span></div>
        <div class="text-sm font-bold tabular-nums text-sky-400" id="sumInTokens">0</div>
        <div class="muted text-[11px] tabular-nums" id="sumInSplit"></div>
      </div>
      <div class="subcard space-y-0.5">
        <div class="flex justify-between muted text-[11px]"><span data-i18n="cumOutput">输出 Token</span><span id="costDetailSplit" class="text-violet-400 tabular-nums"></span></div>
        <div class="text-sm font-bold tabular-nums text-violet-400" id="sumOutTokens">0</div>
        <div class="muted text-[11px] tabular-nums" id="sumOutSplit"></div>
      </div>
    </div>

    <div class="pt-2 border-t border-slate-500/15 space-y-2">
      <div class="font-medium text-xs" data-i18n="perModelTitle">按模型</div>
      <div id="modelStatsList" class="space-y-2"></div>
    </div>
  </div>

  <!-- Trend chart and per-turn table -->
  <div class="card space-y-2">
    <div class="flex flex-wrap items-center justify-between gap-1">
      <span class="font-medium" data-i18n="trendTitle">每轮 Context 与速度</span>
      <div class="flex items-center gap-3 muted text-[11px]">
        <span><span class="inline-block w-2 h-2 rounded-full bg-sky-400 mr-1"></span><span data-i18n="axisCtx">Context（左）</span></span>
        <span><span class="inline-block w-2 h-2 rounded-full bg-violet-400 mr-1"></span><span data-i18n="axisTps">tok/s（右）</span></span>
      </div>
    </div>
    <svg id="trendSvg" viewBox="0 0 400 105" class="w-full h-24 overflow-visible"></svg>
  </div>

  <div class="card space-y-1.5">
    <div class="flex items-center justify-between">
      <span class="font-medium" data-i18n="turnTableTitle">每轮明细（最新在前）</span>
      <span class="muted text-[11px]" id="updatedTime"></span>
    </div>
    <div class="overflow-x-auto max-h-64 overflow-y-auto">
      <table id="turnTable">
        <thead>
          <tr class="muted">
            <th>#</th>
            <th class="wide-only" data-i18n="thModel">模型</th>
            <th>Context</th>
            <th class="wide-only" data-i18n="thCache">缓存</th>
            <th class="wide-only" data-i18n="thOut" data-i18n-title="thOutTitle">输出</th>
            <th class="wide-only col-ttft" data-i18n="thTtft" data-i18n-title="thTtftTitle">TTFT</th>
            <th class="wide-only" data-i18n="thDur">耗时</th>
            <th data-i18n-title="thTpsTitle">tok/s</th>
            <th data-i18n="thCost">费用</th>
          </tr>
        </thead>
        <tbody id="turnTableBody"></tbody>
      </table>
    </div>
  </div>
  <script>
    // Every visible label lives here. "{name}" placeholders are filled by tr(key, vars).
    const I18N = {
      zh: {
        autoFollow: "跟随最新",
        convSelectTitle: "切换对话",
        pricingSelectTitle: "计价方案",
        priceAuto: "计价：按模型自动",
        langToggleTitle: "Switch to English",
        srcRpcTitle: "数据来自 Language Server，耗时精确到毫秒",
        srcTranscriptTitle: "数据来自 Transcript，耗时按秒估算",
        ctxHeroTitle: "Context 用量",
        turnCount: "{n} 轮",
        compactedCount: " · 已压缩 {n} 次",
        statusSafe: "🟢 空间充足",
        statusWarn: "🟡 接近自动压缩",
        statusDanger: "🔴 即将自动压缩",
        compBarTitle: "自动压缩阈值",
        compLeft: "还剩 {n}",
        tick200k: "▲ 200k 长上下文计价线",
        tick200kTitle: "超过 200k 输入后按长上下文价格计费",
        tickCompTitle: "自动压缩阈值",
        physBarTitle: "模型窗口",
        speedTitle: "速度",
        modeE2e: "含等待",
        modeDec: "仅解码",
        decode: "解码 {n}",
        visible: "正文 {n}",
        avg: "均值 {n} tok/s",
        peak: "峰值 {n} tok/s",
        lastTurnTitle: "本轮",
        ttft: "首字 {n}s",
        totalTime: "耗时 {n}s",
        outTokens: "输出 {n} Token",
        thinkResp: "思考 {a} · 正文 {b}",
        avgTtft: "平均首字 {n}s",
        cacheTitle: "缓存命中率",
        cached: "命中 {n}",
        newTokens: "新增 {n}",
        sessionRate: "会话平均 {n}%",
        billingTitle: "会话费用",
        multiModelTag: "{n} 个模型，分别计价",
        sessionTokens: "共 {n} Token",
        estTotalCost: "按 API 标价",
        lastTurnCost: "本轮 {n}",
        highTierTurns: "{n} 轮 >200k",
        highTierTitle: "该轮按 >200k 价格计费",
        cacheSaved: "缓存节省",
        savedVsNoCache: "无缓存 {cost}，省\u00a0{pct}%",
        cumInput: "输入 Token",
        cumOutput: "输出 Token",
        inSplit: "缓存 {a} · 新增 {b}",
        outSplit: "思考 {a} · 正文 {b}",
        perModelTitle: "按模型",
        priceAs: "计价：{p}",
        saved: "省 {n}",
        costShare: "占 {n}%",
        mTurns: "轮数",
        mTurnsVal: "{n}（{pct}%）",
        mInput: "输入",
        mInputVal: "{n} · 缓存 {pct}%",
        mOutput: "输出",
        mCost: "费用",
        mCostVal: "入 {a} · 出 {b}",
        trendTitle: "每轮 Context 与速度",
        axisCtx: "Context（左）",
        axisTps: "tok/s（右）",
        turnTableTitle: "每轮明细（最新在前）",
        thModel: "模型",

    let currentLang = "zh";
    try {
      const saved = localStorage.getItem("agy_ctx_lang");
      if (saved === "en" || saved === "zh") currentLang = saved;
      else if (navigator.language && !navigator.language.toLowerCase().startsWith("zh")) currentLang = "en";
    } catch {}

    function tr(key, vars) {
      const s = (I18N[currentLang] && I18N[currentLang][key]) || I18N.zh[key] || key;
      return vars ? s.replace(/\{(\w+)\}/g, function(_, k) { return vars[k]; }) : s;
    }

    function applyStaticI18n() {
      document.documentElement.lang = currentLang === "zh" ? "zh-CN" : "en";
      const btn = document.getElementById("langToggle");
      if (btn) btn.textContent = currentLang === "zh" ? "EN" : "中文";
      document.querySelectorAll("[data-i18n]").forEach(function(el) {
        el.textContent = tr(el.getAttribute("data-i18n"));
      });
      document.querySelectorAll("[data-i18n-title]").forEach(function(el) {
        el.title = tr(el.getAttribute("data-i18n-title"));
      });
    }

    const params = new URLSearchParams(window.location.search);
    const urlConvId = params.get("conversationId") || "";
    let selectedConvId = urlConvId;
    let lastMetricsData = null;
    const convSelect = document.getElementById("convSelect");
    const pricingSelect = document.getElementById("pricingSelect");
    const autoFollow = document.getElementById("autoFollow");
    const langToggle = document.getElementById("langToggle");
    if (urlConvId) autoFollow.checked = false;

    langToggle.addEventListener("click", function() {
      currentLang = currentLang === "zh" ? "en" : "zh";
      try { localStorage.setItem("agy_ctx_lang", currentLang); } catch {}
      applyStaticI18n();
      if (lastMetricsData) renderData(lastMetricsData);
    });
    applyStaticI18n();

    convSelect.addEventListener("change", function() {
      selectedConvId = convSelect.value;
      autoFollow.checked = false;
      fetchAndRender();
    });
    pricingSelect.addEventListener("change", function() {
      fetchAndRender();
    });
    autoFollow.addEventListener("change", function() {
      if (autoFollow.checked) {
        selectedConvId = "";
        fetchAndRender();
      }
    });

    function fmtNum(n) {
      return Number(n || 0).toLocaleString("en-US");
    }
    function fmtCompact(n) {
      const v = Number(n || 0);
      if (v >= 1000000) return (v / 1000000).toFixed(2) + "M";
      if (v >= 1000) return (v / 1000).toFixed(1) + "k";
      return String(v);
    }
    function fmtUsd(n) {
      const v = Number(n || 0);
      if (v >= 1) return "$" + v.toFixed(2);
      if (v >= 0.01) return "$" + v.toFixed(3);
      return "$" + v.toFixed(4);
    }
    function esc(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, function(c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
      });
    }
    function shortModel(m) {
      const s = String(m || "Gemini").trim();
      return s.replace(/\s*\(High\)/i, "").replace(/^models\//, "");
    }

    function renderChart(turns) {
      const svg = document.getElementById("trendSvg");
      if (!turns || turns.length === 0) {
        svg.innerHTML = "<text x=\"200\" y=\"52\" text-anchor=\"middle\" fill=\"currentColor\" opacity=\"0.4\">" + tr("noTurns") + "</text>";
        return;
      }
      const w = 400, h = 92, padL = 34, padR = 32, padT = 8, padB = 16;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;
      const maxCtx = Math.max(1000, ...turns.map(function(t) { return t.contextUsed; }));
      const maxTps = Math.max(10, ...turns.map(function(t) { return t.e2eTps > 0 ? t.e2eTps : t.decodeTps; }));
      const xAt = function(i) { return turns.length === 1 ? padL + plotW / 2 : padL + (i / (turns.length - 1)) * plotW; };
      const yCtx = function(v) { return padT + plotH - (v / maxCtx) * plotH; };
      const yTps = function(v) { return padT + plotH - (v / maxTps) * plotH; };

      const ctxPts = turns.map(function(t, i) { return xAt(i).toFixed(1) + "," + yCtx(t.contextUsed).toFixed(1); }).join(" ");
      const tpsPts = turns.map(function(t, i) {
        const val = t.e2eTps > 0 ? t.e2eTps : t.decodeTps;
        return xAt(i).toFixed(1) + "," + yTps(val).toFixed(1);
      }).join(" ");

      const dotsCtx = turns.map(function(t, i) {
        return "<circle cx=\"" + xAt(i).toFixed(1) + "\" cy=\"" + yCtx(t.contextUsed).toFixed(1) + "\" r=\"2.3\" fill=\"#38bdf8\" />";
      }).join("");
      const dotsTps = turns.map(function(t, i) {
        const val = t.e2eTps > 0 ? t.e2eTps : t.decodeTps;
        return "<circle cx=\"" + xAt(i).toFixed(1) + "\" cy=\"" + yTps(val).toFixed(1) + "\" r=\"2.3\" fill=\"#a78bfa\" />";
      }).join("");

      svg.innerHTML =
        "<line x1=\"" + padL + "\" y1=\"" + padT + "\" x2=\"" + (w - padR) + "\" y2=\"" + padT + "\" stroke=\"currentColor\" stroke-opacity=\"0.1\" />" +
        "<line x1=\"" + padL + "\" y1=\"" + (padT + plotH) + "\" x2=\"" + (w - padR) + "\" y2=\"" + (padT + plotH) + "\" stroke=\"currentColor\" stroke-opacity=\"0.2\" />" +
        "<text x=\"" + (padL - 4) + "\" y=\"" + (padT + 8) + "\" text-anchor=\"end\" font-size=\"10\" fill=\"#38bdf8\">" + fmtCompact(maxCtx) + "</text>" +
        "<text x=\"" + (padL - 4) + "\" y=\"" + (padT + plotH) + "\" text-anchor=\"end\" font-size=\"10\" fill=\"currentColor\" opacity=\"0.5\">0</text>" +
        "<text x=\"" + (w - padR + 4) + "\" y=\"" + (padT + 8) + "\" text-anchor=\"start\" font-size=\"10\" fill=\"#a78bfa\">" + maxTps.toFixed(0) + "</text>" +
        "<polyline fill=\"none\" stroke=\"#38bdf8\" stroke-width=\"2\" points=\"" + ctxPts + "\" />" +
        "<polyline fill=\"none\" stroke=\"#a78bfa\" stroke-width=\"2\" stroke-dasharray=\"3,2\" points=\"" + tpsPts + "\" />" +
        dotsCtx + dotsTps;
    }

    function renderModelStats(models) {
      const container = document.getElementById("modelStatsList");
      if (!models || models.length === 0) {
        container.innerHTML = "<div class=\"muted text-[11px]\">" + tr("noModelData") + "</div>";
        return;
      }
      const field = function(label, value) {
        return "<div><span class=\"muted\">" + label + " </span>" + value + "</div>";
      };
      container.innerHTML = models.map(function(m) {
        const showRawId = m.modelId && m.modelId !== m.model;
        const hiTag = m.highTierTurnCount > 0
          ? ("<span class=\"px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-400 text-[10px]\" title=\"" + esc(tr("highTierTitle")) + "\">" + tr("highTierTurns", { n: m.highTierTurnCount }) + "</span>")
          : "";
        const tps = m.avgE2eTps > 0 ? m.avgE2eTps : m.avgDecodeTps;
        const tpsStr = tps > 0 ? (tps.toFixed(1) + " tok/s") : "--";
        return "<div class=\"subcard space-y-1.5\">" +
          "<div class=\"flex flex-wrap items-center justify-between gap-1\">" +
            "<div class=\"flex flex-wrap items-center gap-1.5\">" +
              "<span class=\"font-semibold text-xs\">" + esc(m.model) + "</span>" +
              (showRawId ? ("<code class=\"px-1 py-0.5 rounded bg-slate-500/20 muted text-[10px]\">" + esc(m.modelId) + "</code>") : "") +
              "<span class=\"px-1.5 py-0.5 rounded bg-violet-500/15 text-violet-300 text-[10px]\" title=\"" + esc(m.pricingProfileFullLabel) + "\">" + tr("priceAs", { p: esc(m.pricingProfileLabel) }) + "</span>" +
              hiTag +
            "</div>" +
            "<div class=\"flex items-center gap-2 tabular-nums\">" +
              "<span class=\"text-sky-400 text-[11px]\">" + tr("saved", { n: fmtUsd(m.savedByCacheUsd) }) + "</span>" +
              "<span class=\"font-bold text-sm text-emerald-400\">" + fmtUsd(m.costUsd) + "</span>" +
              "<span class=\"muted text-[11px]\">" + tr("costShare", { n: Number(m.costSharePct || 0).toFixed(0) }) + "</span>" +
            "</div>" +
          "</div>" +
          "<div class=\"w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden flex\">" +
            "<div class=\"h-full bg-emerald-400 transition-all duration-300\" style=\"width: " + Math.min(100, Number(m.costSharePct || 0)).toFixed(1) + "%\"></div>" +
          "</div>" +
          "<div class=\"grid grid-cols-2 sm:grid-cols-4 gap-1.5 text-[11px] pt-0.5 tabular-nums\">" +
            field(tr("mTurns"), tr("mTurnsVal", { n: m.turnCount, pct: m.turnSharePct.toFixed(0) })) +
            field(tr("mInput"), tr("mInputVal", { n: fmtCompact(m.inCached + m.inUncached), pct: m.cacheHitRate.toFixed(1) })) +
            field(tr("mOutput"), fmtCompact(m.outTokens) + " · " + tpsStr) +
            field(tr("mCost"), tr("mCostVal", { a: fmtUsd(m.inputCostUsd), b: fmtUsd(m.outputCostUsd) })) +
          "</div>" +
        "</div>";
      }).join("");
    }

    function renderData(data) {
      const s = data.summary || {};
      const list = data.recentConversations || [];
      const currentOptions = Array.from(convSelect.options).map(function(o) { return o.value; }).join(",");
      const nextOptions = list.map(function(x) { return x.conversationId; }).join(",");
      if (currentOptions !== nextOptions) {
        convSelect.innerHTML = list.map(function(x) {
          return "<option value=\"" + esc(x.conversationId) + "\">" + esc(x.conversationId.slice(0, 8)) + " (" + esc(x.surface.replace("antigravity", "agy")) + ")</option>";
        }).join("");
      }
      if (data.conversationId) {
        convSelect.value = data.conversationId;
        if (!selectedConvId) selectedConvId = data.conversationId;
      }

      const modelBadge = document.getElementById("modelBadge");
      modelBadge.textContent = data.model || "Gemini";
      modelBadge.title = data.model || "";
      const srcBadge = document.getElementById("sourceBadge");
      srcBadge.textContent = data.rpcConnected ? "RPC" : "Transcript";
      srcBadge.title = data.rpcConnected ? tr("srcRpcTitle") : tr("srcTranscriptTitle");
      srcBadge.className = "px-1.5 py-0.5 rounded text-[11px] border shrink-0 " +
        (data.rpcConnected ? "border-emerald-500/40 text-emerald-400" : "border-amber-500/40 text-amber-400");

      const maxPhys = Number(s.maxContext || 1048576);
      const compLimit = Number(s.compactionMaxContext || 256000);
      const pct = Number(s.contextUsedPct || 0);
      const compPct = Number(s.compactionUsedPct || 0);

      document.getElementById("ctxTokens").textContent =
        fmtCompact(maxPhys) + " · " + pct.toFixed(1) + "%";
      document.getElementById("ctxPhysBar").style.width = Math.min(100, pct).toFixed(2) + "%";
      // The 200k ticks show only when the current model's price has a long-context tier.
      const tierAt = Number(s.priceTierThreshold || 0);
      const tick200kPhys = document.getElementById("tick200kPhys");
      tick200kPhys.style.left = Math.min(100, (tierAt / maxPhys) * 100).toFixed(2) + "%";
      tick200kPhys.style.display = tierAt > 0 ? "" : "none";
      document.getElementById("tick256kPhys").style.left = Math.min(100, (compLimit / maxPhys) * 100).toFixed(2) + "%";
      const tick200kComp = document.getElementById("tick200kComp");
      tick200kComp.style.left = Math.min(100, (tierAt / compLimit) * 100).toFixed(2) + "%";
      tick200kComp.style.display = tierAt > 0 && tierAt < compLimit ? "" : "none";
      document.getElementById("tick200kLegend").style.display = tick200kComp.style.display;

      const level = compPct > 85 ? "rose" : compPct > 60 ? "amber" : "emerald";
      const ctxBar = document.getElementById("ctxBar");
      ctxBar.style.width = Math.min(100, compPct).toFixed(1) + "%";
      ctxBar.className = "h-full transition-all duration-300 bg-" + level + "-500";
      const ctxRemainEl = document.getElementById("ctxRemain");
      ctxRemainEl.className = "text-sm font-bold tabular-nums text-" + level + "-400";
      ctxRemainEl.textContent = fmtCompact(s.contextUsed) + " / " + fmtCompact(compLimit) + " · " + compPct.toFixed(1) + "%";
      const statusBadge = document.getElementById("ctxStatusBadge");
      statusBadge.className = "px-2 py-0.5 rounded text-[11px] font-medium bg-" + level + "-500/15 text-" + level + "-400 border border-" + level + "-500/30";
      statusBadge.textContent = tr(level === "rose" ? "statusDanger" : level === "amber" ? "statusWarn" : "statusSafe");
      document.getElementById("ctxCompRemain").textContent = tr("compLeft", { n: fmtCompact(s.compactionRemaining) });
      const cpCount = Number(s.checkpointCount || 0);
      document.getElementById("turnCountBadge").textContent =
        tr("turnCount", { n: s.turnCount || 0 }) + (cpCount > 0 ? tr("compactedCount", { n: cpCount }) : "");

      const hitRate = Number(s.lastCacheHitRate || 0);
      document.getElementById("cacheRate").textContent = hitRate.toFixed(1) + "%";
      document.getElementById("cacheTokens").textContent = tr("cached", { n: fmtCompact(s.lastCachedTokens) });
      document.getElementById("cacheBar").style.width = Math.min(100, hitRate).toFixed(1) + "%";
      document.getElementById("uncachedTokens").textContent = tr("newTokens", { n: fmtCompact(s.lastUncachedTokens) });
      document.getElementById("sessionCacheRate").textContent = tr("sessionRate", { n: Number(s.sessionCacheHitRate || 0).toFixed(1) });

      const e2eTps = Number(s.lastE2eTps || 0);
      const decTps = Number(s.lastDecodeTps || 0);
      const visTps = Number(s.lastVisibleE2eTps || 0);
      const primaryTps = e2eTps > 0 ? e2eTps : decTps;
      document.getElementById("tpsModeLabel").textContent = e2eTps > 0 ? tr("modeE2e") : tr("modeDec");
      document.getElementById("mainTps").textContent = primaryTps > 0 ? primaryTps.toFixed(1) + " tok/s" : "-- tok/s";
      const subParts = [];
      if (e2eTps > 0 && decTps > 0) subParts.push(tr("decode", { n: decTps.toFixed(1) }));
      if (visTps > 0 && Number(s.lastThinkTokens || 0) > 0) subParts.push(tr("visible", { n: visTps.toFixed(1) }));
      document.getElementById("subTps").textContent = subParts.join(" · ");
      const avgE2e = Number(s.avgE2eTps || 0);
      const avgDec = Number(s.avgDecodeTps || 0);
      document.getElementById("avgTps").textContent = tr("avg", { n: (avgE2e > 0 ? avgE2e : avgDec).toFixed(1) });
      document.getElementById("peakTps").textContent = tr("peak", { n: Number(s.peakE2eTps || s.peakTps || 0).toFixed(1) });

      // Without RPC there is no TTFT and no thinking split; show only what the data has.
      document.getElementById("ttftVal").textContent = s.lastTtftSec > 0
        ? tr("ttft", { n: Number(s.lastTtftSec).toFixed(2) })
        : (s.lastE2eSec > 0 ? tr("totalTime", { n: Number(s.lastE2eSec).toFixed(1) }) : "");
      document.getElementById("outTokens").textContent = tr("outTokens", { n: fmtNum(s.lastOutTokens) });
      const thinkResp = s.lastThinkTokens > 0
        ? tr("thinkResp", { a: fmtCompact(s.lastThinkTokens), b: fmtCompact(s.lastRespTokens) })
        : "";
      const avgTtft = s.avgTtftSec > 0 ? tr("avgTtft", { n: Number(s.avgTtftSec).toFixed(2) }) : "";
      document.getElementById("thinkRespSplit").textContent = thinkResp;
      document.getElementById("avgTtft").textContent = avgTtft;
      document.getElementById("lastTurnFooter").style.display = thinkResp || avgTtft ? "" : "none";

      document.getElementById("sessionTotalBadge").textContent = tr("sessionTokens", { n: fmtCompact(s.sessionTotalTokens) });
      document.getElementById("sumInTokens").textContent = fmtNum(s.totalInputTokens);
      document.getElementById("sumInSplit").textContent =
        tr("inSplit", { a: fmtCompact(s.totalInCached), b: fmtCompact(s.totalInUncached) });
      document.getElementById("sumOutTokens").textContent = fmtNum(s.totalOutTokens);
      document.getElementById("sumOutSplit").textContent = s.totalThinkTokens > 0
        ? tr("outSplit", { a: fmtCompact(s.totalThinkTokens), b: fmtCompact(s.totalRespTokens) })
        : "";

      document.getElementById("pricingModelTag").textContent = pricingSelect.value === "auto" && s.modelCount > 1
        ? tr("multiModelTag", { n: s.modelCount })
        : (s.pricingProfileLabel || "");
      document.getElementById("costTotalUsd").textContent = fmtUsd(s.totalCostUsd);
      const hiCount = Number(s.highTierTurnCount || 0);
      document.getElementById("costLastTurn").textContent =
        tr("lastTurnCost", { n: fmtUsd(s.lastTurnCostUsd) }) + (hiCount > 0 ? (" · " + tr("highTierTurns", { n: hiCount })) : "");
      document.getElementById("costSplitUsd").textContent = fmtUsd(s.totalInputCostUsd);
      document.getElementById("costDetailSplit").textContent = fmtUsd(s.totalOutputCostUsd);
      document.getElementById("costSavedUsd").textContent = fmtUsd(s.savedByCacheUsd);
      document.getElementById("costNoCacheUsd").textContent = s.noCacheTotalCostUsd > 0
        ? tr("savedVsNoCache", { pct: Number(s.savedByCachePct || 0).toFixed(1), cost: fmtUsd(s.noCacheTotalCostUsd) })
        : "";

      const convTitle = document.getElementById("convTitle");
      convTitle.textContent = data.title || "";
      convTitle.title = data.title || "";
      document.getElementById("updatedTime").textContent = new Date().toLocaleTimeString();

      renderModelStats(data.modelStats || []);
      renderChart(data.turns || []);

      const turns = data.turns || [];
      document.getElementById("turnTable").classList.toggle("no-ttft", !turns.some(function(t) { return t.ttftSec > 0; }));
      const tbody = document.getElementById("turnTableBody");
      tbody.innerHTML = turns.slice().reverse().map(function(t) {
        const outSplit = t.thinkTokens > 0
          ? (fmtNum(t.outTokens) + " <span class=\"muted\">(" + fmtCompact(t.thinkTokens) + "/" + fmtCompact(t.respTokens) + ")</span>")
          : fmtNum(t.outTokens);
        const durCell = t.interrupted
          ? "<span class=\"text-rose-400\">" + tr("interrupted") + "</span>"
          : (t.e2eSec > 0 ? t.e2eSec.toFixed(1) + "s" : "-");
        const tpsCell = t.e2eTps > 0
          ? (t.e2eTps.toFixed(1) + (t.decodeTps > 0 ? " <span class=\"muted\">(" + t.decodeTps.toFixed(0) + ")</span>" : ""))
          : (t.decodeTps > 0 ? t.decodeTps.toFixed(1) : "-");
        const costCell = fmtUsd(t.costUsd || 0) + (t.isHighTier ? " <span class=\"text-amber-400\" title=\"" + esc(tr("highTierTitle")) + "\">↑</span>" : "");
        const modelCell = "<span class=\"muted\" title=\"" + esc((t.modelId || t.model || "") + " · " + (t.pricingProfileLabel || "")) + "\">" + esc(shortModel(t.model || t.modelId)) + "</span>";
        return "<tr>" +
          "<td class=\"font-medium\">#" + t.turn + "</td>" +
          "<td class=\"wide-only\">" + modelCell + "</td>" +
          "<td>" + fmtCompact(t.contextUsed) + "</td>" +
          "<td class=\"wide-only text-sky-400\">" + t.cacheHitRate.toFixed(1) + "%</td>" +
          "<td class=\"wide-only\">" + outSplit + "</td>" +
          "<td class=\"wide-only col-ttft text-amber-400\">" + (t.ttftSec > 0 ? t.ttftSec.toFixed(2) + "s" : "-") + "</td>" +
          "<td class=\"wide-only\">" + durCell + "</td>" +
          "<td class=\"font-semibold text-violet-400\">" + tpsCell + "</td>" +
          "<td class=\"text-emerald-400\">" + costCell + "</td>" +
        "</tr>";
      }).join("");
    }

    async function fetchAndRender() {
      try {
        const q = new URLSearchParams();
        if (!autoFollow.checked && selectedConvId) q.set("conversationId", selectedConvId);
        if (pricingSelect && pricingSelect.value) q.set("pricing", pricingSelect.value);
        const res = await fetch("/api/metrics?" + q.toString());
        if (!res.ok) return;
        const data = await res.json();
        lastMetricsData = data;
        renderData(data);
      } catch (e) {
        console.error("Failed to refresh metrics:", e);
      }
    }

    fetchAndRender();
    setInterval(function() {
      if (!document.hidden) fetchAndRender();
    }, 2000);
    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) fetchAndRender();
    });
  </script>
</body>
</html>
